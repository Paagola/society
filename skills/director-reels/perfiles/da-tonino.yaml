  luz: >-
    Low-key 'dinner light': a single soft-edged or hard key from behind and to the side as a rim light
    on steam, sauce and crust edges; the food is the brightest thing in the frame; the background falls
    to near black with one or two warm bulbs as soft bokeh points (the restaurant's pendant lamps).
    Deep blacks, highlights never clipped, neutral-warm white balance around 4300-5000K, true food colours.
  superficie: "pase de acero oscuro o mesa oscura; manos con guante de nitrilo negro mate en cocina, mano desnuda sin anillos en mesa"
