invenciones_recurrentes:
  - "logo o emblema sobre la mantelería (regla 24)"
  - "servilleta, paño o papel bajo el plato (regla 26)"
  - "manchas, motas o migas en mantel y plato (regla 25)"
  - "lámpara de cristal copiada de la referencia"
  - "silla metálica, tapicería de piel de vaca, mesa oscura brillante"
  - "etiqueta con texto en la botella"
  - "manos no pedidas en planos de sala (P3 del Reel 09)"
  - "blancos amarillentos: pedir blancos neutros (regla 9ter)"
  - "aspecto HDR de inmobiliaria (regla 9quinquies)"

prohibiciones:
  - "texto a vídeo, stock o archivo"
  - "fuego, brasa o humo generados si existe material real (regla 22)"
  - "platos comidos o copas vacías (regla 15)"
  - "personas identificables sin referencia aprobada; nunca la persona del vídeo de referencia (regla 18 de imagen)"
  - "cámara handheld o «static camera» a secas (reglas 5 y 11)"
  - "repetir ángulo entre vídeos generados salvo transición estudiada (variedad de ángulos, 2026-09-15)"

referencias_de_video:                # CLAUDE.md §21, corrección del Reel 09
  obligatorio_buscar: true
  minimo_candidatas: 2
  busqueda: "site:instagram.com/reel <plato> + yt-dlp; YouTube devuelve horizontales"
  filtro: "vino, carne a la brasa, cocina tradicional o restaurante rural; si no, solo el mecanismo"
