    transicion: {entrada: "luz a negro", salida: "corte seco"}
    rotulo: ""
    criterios_rechazo: ["cristales", "bombillas que aparecen o desaparecen"]
    coste_est_creditos: 5.25
  - id: P5
    funcion: heroe
    t: [5.1, 7.0]
    escalon: L4
    justificacion_escalon: "no hay metraje real del vertido en la sala"
    fuente: {tipo: generado}
    generacion: V1
    accion: {descripcion: "chorro de vino tinto cayendo en la primera copa de la mesa", clase: compleja, origen_movimiento: liquido}
    contiene: [mesa, copa, manos, liquido]
    anclas: [mantel, copa_vino]
    manos: [hombre]
    angulo: {posicion: frontal, altura: ras_de_mesa, lente_mm: 65}
    camara: {movimiento: push_in, aparato: slider_motorizado, recorrido: "5 %"}
    beats:
      - {t: "0.0-3.3s", accion: "el chorro sigue cayendo; el nivel sube con ondas", estado_final: "la mano levanta la botella y el chorro termina en una gota"}
    transicion: {entrada: "corte seco", salida: "corte seco"}
    rotulo: ""
    criterios_rechazo: ["vino derramado", "texto en la botella", "otras copas que se mueven"]
    coste_est_creditos: 30
  - id: P6
    funcion: prueba
    t: [7.0, 9.2]
    escalon: L4
    justificacion_escalon: "no hay metraje real del plato con la copa servida"
    fuente: {tipo: generado}
    generacion: V1
    accion: {descripcion: "yemas de mujer en el pie de la copa la acercan 1 cm al plato", clase: compleja, origen_movimiento: mano}
    contiene: [mesa, plato, copa, manos]
    anclas: [plato, copa_vino, mantel]
    manos: [mujer]
    angulo: {posicion: tres_cuartos, altura: alto, lente_mm: 50}
    camara: {movimiento: grua_bajada, aparato: grua_mecanica, recorrido: "4 %"}
    beats:
      - {t: "0.0-3.4s", accion: "un gesto corto de deslizar la copa", estado_final: "dedos quietos en el pie, copa junto al plato"}
    transicion: {entrada: "corte seco", salida: "corte seco al cierre"}
    rotulo: ""
    criterios_rechazo: ["mano entera en vez de yemas", "plato con texto"]
    coste_est_creditos: 30
  - id: P8
    funcion: cierre
    t: [9.2, 11.4]
    escalon: L4
    justificacion_escalon: "el rincón con aplique y copa en primer término no existe en metraje real"
    fuente: {tipo: generado}
    generacion: V-P8
    accion: {descripcion: "rincón de la sala tras la copa; el foco pasa de la copa a la sala", clase: simple, origen_movimiento: camara}
    contiene: [mesa, copa]
    anclas: [sala, copa_vino, mantel]
    angulo: {posicion: frontal, altura: mesa, lente_mm: 50}
    camara: {movimiento: push_in, aparato: slider_motorizado, recorrido: "3 %"}
    beats:
      - {t: "0.0-1.0s", accion: "brillo en la superficie del vino", estado_final: ""}
      - {t: "1.0-2.5s", accion: "el foco viaja de la copa a la sala", estado_final: ""}
      - {t: "2.5-3.0s", accion: "el foco se asienta en la sala", estado_final: "sala nítida, copa desenfocada"}
    transicion: {entrada: "corte seco", salida: "fin"}
    rotulo: "TORRE DE VEGA · «EL MORA»"
    criterios_rechazo: ["gente", "luz que parpadea"]
    incidencias: ["Kling devolvió un desplazamiento lateral en vez del cambio de foco pedido"]
    coste_est_creditos: 5.25

