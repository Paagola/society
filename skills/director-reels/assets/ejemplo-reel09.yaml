# Ejemplo real: Reel 09 «Volvemos a abrir» (Torre de Vega, 2026-09-17), versión de montaje vigente (v5).
# Reconstruido a posteriori con el formato del plan para enseñar cómo se rellena. Los datos salen de
# base-conocimiento-torre-de-vega/09-reel-volvemos-a-abrir-2026-09-17/documentacion-completa.md.
# Prompts: literales de los anexos A y B, salvo K-P2, al que se le añade el negativo de la regla 26
# («no napkin or cloth under the plate») que el linter echó en falta al reconstruirlo.
# Aviso real que queda: W02 (P2 y P3 comparten desplazamiento lateral seguido; la regla 9 pide variar).
# Los keyframes K-P3 a K-P8 remiten al anexo A para no alargar el ejemplo.

reel:
  id: reel_09_volvemos_a_abrir
  cliente: torre-de-vega
  fecha: 2026-09-17
  estado: montaje

brief:
  pieza: "Carta de otoño + fecha; tras la corrección nº 2, «Volvemos a abrir» sin fecha"
  objetivo: reenvio
  motivo_para_reenviar: "reapertura de temporada (la fecha quedó pendiente y se retiró)"
  reel_de_referencia: "plantillas/2026-09-17/01_1835-carne-e-brasa_nueva-temporada_46s_original.mp4"
  metraje_real_disponible: [imagenes/parrilla/clips/parrilla_volteo_master_4k60.mp4]
  estilo_de_luz: dramatico
  duracion_orientativa_s: 12
  voz_en_off: false          # se grabaron muestras; la versión vigente va sin sonido
  cta: "reserva + pregunta al espectador"
  presupuesto_creditos: 150  # el cliente no lo fijó; valor de ejemplo

verdad:
  anclas:
    - {id: mantel, descripcion: "beige con relieve sobre bajo-mantel rosa pálido", fotos: [imagenes/local/mesa-ventana.jpg, imagenes/local/mesas-restaurante3.jpg], dificultad: baja}
    - {id: silla, descripcion: "madera color miel, respaldo tallado, balaustres torneados, asiento de enea", fotos: [imagenes/local/mesa-ventana.jpg], dificultad: baja}
    - {id: sala, descripcion: "ladrillo visto, apliques de forja, visillos blancos, chimenea de piedra", fotos: [imagenes/local/mesas-restaurante4.jpg, imagenes/local/panoramica-restaurante.jpg], dificultad: media}
    - {id: lampara, descripcion: "corona de forja negra con bombillas vela", fotos: [imagenes/local/photo_5805514308144795419_y.jpg], dificultad: media}
    - {id: plato, descripcion: "blanco con relieve de volutas y rombos en el ala", fotos: [imagenes/local/plato-blanco-formal.jpg], dificultad: baja}
    - {id: copa_vino, descripcion: "copa grande de cristal fino", fotos: [imagenes/vinos/copa-vino-grande.jpg], dificultad: baja}
    - {id: botellero, descripcion: "botellero de metal negro", fotos: [imagenes/local/photo_5805514308144795414_y.jpg], dificultad: alta}
  metraje_real:
    - ruta: imagenes/parrilla/clips/parrilla_volteo_master_4k60.mp4
      contenido: "pala levanta el chuletón entre llamas"
      tramos_utiles: ["3.4-5.8"]
      usos_previos: [varios reels anteriores]   # el cliente lo retiró en la v2 por repetido
  invenciones_recurrentes: ["lámpara de cristal de la plantilla", "etiqueta con texto en la botella", "botellero inventado (dos veces)", "mano no pedida en la sala"]
  no_existe: ["carta de otoño documentada: ni platos, ni fecha, ni fotos"]

tratamiento:
  motivo_para_reenviar: "el restaurante vuelve a abrir: plan para ir"
  momento_heroe: "el vino cayendo en la primera copa de la mesa"
  emocion: ["la silla se retira para alguien", "la sala espera en penumbra", "la primera copa se sirve"]
  foco_sensorial: "vista: luz cálida sobre negro"
  motivo_visual: "formas redondas y luz cálida: copa, lámpara, plato"
  curva_de_ritmo: "2,4 s de gancho → planos de 1,1-1,9 s → sostener 2,2 s el cierre"
  cierre: "placa TORRE DE VEGA · «EL MORA»"

conceptos:
  - {id: C1, mecanismo: M3, titulo: "Anuncio de temporada sin platos", fotograma_1: "mano retirando la silla", arco: "bienvenida → sala → luz → vino → mesa → marca", planos_generados: 6, coste_est_creditos: 125, respuesta_pregunta_control: "sí, si lleva fecha; sin fecha se queda en pieza de ambiente"}
  - {id: C2, mecanismo: M5, titulo: "Mismo plano, cambia el plato", fotograma_1: "primer plato en mesa con mano", arco: "4-6 platos en el mismo punto del gesto", planos_generados: 2, coste_est_creditos: 80, respuesta_pregunta_control: "no hay platos de otoño documentados"}
  - {id: C3, mecanismo: M1, titulo: "Brasa con anuncio", fotograma_1: "pala entre llamas (real)", arco: "brasa → sala → mesa", planos_generados: 4, coste_est_creditos: 100, respuesta_pregunta_control: "sí con fecha; metraje de brasa muy usado"}
concepto_elegido: C1

planos:
  - id: P2
    funcion: gancho
    t: [0.0, 2.4]
    escalon: L4
    justificacion_escalon: "no hay metraje real de una mano retirando la silla"
    fuente: {tipo: generado}
    generacion: V1
    accion: {descripcion: "mano de mujer, ya agarrando el respaldo tallado, retira la silla unos 10 cm", clase: compleja, origen_movimiento: mano}
    contiene: [silla, mesa, plato, copa, manos]
    anclas: [silla, mantel, plato, copa_vino]
    manos: [mujer]
    angulo: {posicion: lateral, altura: respaldo, lente_mm: 50}
    camara: {movimiento: lateral, aparato: slider_motorizado, recorrido: "5 %", direccion: izquierda}
    beats:
      - {t: "0.0-2.4s", accion: "un tirón suave de la silla", estado_final: "mano quieta sobre el respaldo, silla asentada"}
    transicion: {entrada: "", salida: "corte seco a la sala"}
    rotulo: "VOLVEMOS A ABRIR"
    criterios_rechazo: ["dedos que cambian", "anillo que aparece", "silla que se deforma"]
    coste_est_creditos: 30
  - id: P3
    funcion: desarrollo
    t: [2.4, 4.0]
    escalon: L4
    justificacion_escalon: "la sala en penumbra con copa delante no existe en metraje real"
    fuente: {tipo: generado}
    generacion: V-P3
    accion: {descripcion: "sala vacía; solo viaja la cámara", clase: simple, origen_movimiento: camara}
    contiene: [mesa, copa]
    anclas: [sala, mantel, copa_vino]
    angulo: {posicion: frontal, altura: sentado, lente_mm: 35}
    camara: {movimiento: lateral, aparato: slider_motorizado, recorrido: "8 %", direccion: derecha}
    beats:
      - {t: "0.0-1.5s", accion: "brillo leve en el vino de la copa", estado_final: ""}
      - {t: "1.5-3.0s", accion: "solo viaja la cámara", estado_final: "sala quieta, copa en primer término"}
    transicion: {entrada: "corte seco", salida: "luz a negro hacia la lámpara"}
    rotulo: "UNA NUEVA TEMPORADA"
    criterios_rechazo: ["gente que aparece", "sillas que cambian"]
    incidencias: ["en el keyframe apareció una mano no pedida en el pie de la copa; se presentó sin tocar"]
    coste_est_creditos: 5.25
  - id: P4
    funcion: desarrollo
    t: [4.0, 5.1]
    escalon: L4
    justificacion_escalon: "no hay metraje real de la lámpara"
    fuente: {tipo: generado}
    generacion: V-P4
    accion: {descripcion: "lámpara encendida; solo viaja la cámara", clase: simple, origen_movimiento: camara}
    contiene: [lampara]
    anclas: [lampara]
    angulo: {posicion: contrapicado, altura: bajo, lente_mm: 85}
    camara: {movimiento: arco, aparato: slider_motorizado, recorrido: "6°", direccion: izquierda_a_derecha}
