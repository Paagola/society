  objetivo: ""                    # retencion | reenvio | seguidores
  motivo_para_reenviar: ""        # fecha, novedad o aviso real; o "ninguno"
  reel_de_referencia: ""          # URL, ruta o "ninguno"
  metraje_real_disponible: []     # rutas
  estilo_de_luz: ""               # clave de perfil.estilos_de_luz (dramatico | natural_difusa)
  duracion_orientativa_s: 12
  voz_en_off: false
  cta: ""
  presupuesto_creditos: 0

