# Plan de Reel — fuente de verdad de la producción.
# Copiar a la carpeta del reel como plan.yaml y rellenar por etapas.
# Validar con: python scripts/lint_reel.py plan.yaml --perfil perfiles/<cliente>.yaml --raiz <carpeta_cliente>
# Texto para el cliente en español; campos "prompt" en inglés.

reel:
  id: reel_NN_nombre
  cliente: torre-de-vega          # nombre del archivo en perfiles/
  fecha: 2026-MM-DD
  estado: brief                   # brief | referencia | conceptos | planos | verdad | keyframes | clips | montaje | publicado

# ── Etapa 1 · brief único: estrategia (marketing-hosteleria, references/07 §3) + producción ──
brief:
  pieza: ""
  objetivo: ""                    # descubrimiento | consideracion | conversion | relacion (uno)
  situacion_de_consumo: ""        # p. ej. "hay una novedad con fecha"
  audiencia: ""                   # seguidores | no_seguidores | ambas
  motivo_para_reenviar: ""        # fecha, novedad o aviso real; o "ninguno"
  hipotesis: ""                   # si X, la métrica Y supera Z, porque…
  variable_probada: ""            # una por pieza
  metrica_y_umbral: ""            # p. ej. "shares/reach > 0,40 % a 7 días"
  guardarrailes: []               # p. ej. "reels_skip_rate <= 68 %"
  cta: ""                         # con acción medible
  condicion_de_publicacion: normal  # normal | prueba | colaborativa | promocionada
  fecha_y_franja: ""
  pie_hashtags_ubicacion: ""      # como máximo 5 hashtags
  audio: ""                       # original | biblioteca permitida | sin música
  etiqueta_ia: ""                 # si | no, con motivo
  dependencias: []
  reel_de_referencia: ""          # URL, ruta o "ninguno"
  metraje_real_disponible: []     # rutas
  estilo_de_luz: ""               # luminosidad de la pieza: la medida en el reel de referencia o la del selector (estudio | natural | calida | …); la ficha solo guarda la del local por defecto
  duracion_orientativa_s: 12
  voz_en_off: false

# ── Etapa 2 · análisis del reel de referencia (directoria hosteleria/07 §1, director/references/08 §3) ──
referencia:
  cortes_s: []                    # umbral 0,25 y 0,1
  energia: {mediana: 0, p90: 0, pct_rapidos: 0}
  picos_audio_s: []               # dónde cortar, cámara lenta o rápida, transiciones y efectos
  luz: {mediana: 0, p5: 0, p95: 0, rojo_azul: 0, saturacion: 0, pct_sombras: 0}
  cinco_aspectos: []              # por plano: sujeto, movimiento, escena, encuadre, cámara
  se_copia: []
  no_se_copia: []

# ── Etapa 6 · anclas reales: se buscan después del guion (references/01) ──
verdad:
  anclas: []
  #  - id: copa_vino
  #    descripcion: "copa de vino, unos 22 cm de alto · transparente · cristal fino y liso · balón ancho, tallo largo"   # forma y medida · color · material y acabado · detalle (01 §1.1)
  #    fotos: [imagenes/vinos/copa-vino-grande.jpg]
  #    dificultad: baja            # baja | media | alta
  metraje_real: []
  #  - ruta: videos/parrilla.mp4
  #    contenido: ""
  #    duracion_s: 0
  #    tramos_utiles: ["0.0-2.4"]
  #    usos_previos: []
  invenciones_recurrentes: []     # lo que el modelo mete aunque no exista
  no_existe: []                   # lo que no puede aparecer en esta pieza

# ── Etapa 3 · references/02 §1 ────────────────────────────────────────────
tratamiento:
  motivo_para_reenviar: ""
  momento_heroe: ""
  emocion: []                     # 2-4 señales observables
  foco_sensorial: ""
  motivo_visual: ""
  curva_de_ritmo: ""
  cierre: ""

