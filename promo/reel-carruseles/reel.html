<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Society · reel v2</title>
<!--
  Reel v2, 20 s (10 compases a 120 BPM) en 1080 × 1920. Una sola forma que muta y cuenta el flujo
  de Society: la foto del móvil del cliente → la foto profesional → el texto que cae en 3D → el
  carrusel → los 17 posts → la semana planificada → el logo. Todo sale de seek(t): sin transiciones
  CSS, sin temporizadores y sin estado entre fotogramas. Guion: README.md.
-->
<style>
  @font-face { font-family: Geist; src: url(fonts/Geist.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url(fonts/GeistMono.woff2) format('woff2'); }
  @font-face { font-family: Anton; src: url(fonts/Anton.woff2) format('woff2'); }
  @font-face { font-family: Playfair; src: url(fonts/PlayfairDisplay-italic.woff2) format('woff2'); font-style: italic; font-weight: 400 900; }
  @font-face { font-family: AN; src: url(fuentes/ArchivoNarrow.ttf); font-weight: 400 700; }
  :root { --papel: #ECE8DC; --tinta: #141414; --cobalto: #2440E0; --mostaza: #F5C518; --gris: #8A8780; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--papel); }
  body { font-family: Geist, system-ui, sans-serif; color: var(--tinta); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--papel); }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #shape { position: absolute; overflow: hidden; box-sizing: border-box; }
  #outer { position: absolute; width: 0; height: 0; }
  .c { position: absolute; left: 50%; top: 50%; }
  .row { display: flex; align-items: center; }
  .card { position: absolute; left: 0; top: 0; width: 760px; height: 950px; }
  .card img, img.cubre { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip { position: absolute; left: 30px; top: 30px; height: 56px; padding: 0 22px; border-radius: 28px; display: flex; align-items: center; gap: 12px;
          font-size: 26px; font-weight: 600; background: rgba(20,20,20,.72); color: #fff; backdrop-filter: blur(8px); }
  .punto { width: 12px; height: 12px; border-radius: 6px; }
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; }
  svg { overflow: visible; }
  .cap { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
  .cap .n { font-family: Anton; font-size: 54px; color: var(--cobalto); letter-spacing: .02em; display: block; margin-bottom: 6px; }
  .cap .t { font-family: Playfair; font-style: italic; font-weight: 700; font-size: 66px; line-height: 1.05; letter-spacing: -0.5px; }
  .cap .s { font-family: Geist; font-size: 30px; font-weight: 500; color: #55524c; margin-top: 14px; display: block; }
  .nota { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 24px; font-weight: 500; color: #8A8780; letter-spacing: .2px; }
  .masc { position: absolute; transform-origin: 50% 100%; }
  .letra { position: absolute; font-family: Anton; color: #EDE7DD; line-height: 1; transform-origin: 50% 60%; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="shape">
      <!-- 1 · botón -->
      <div id="L_boton" class="c row" style="gap:20px;white-space:nowrap;color:#fff;font-size:42px;font-weight:600;letter-spacing:-0.5px">
        <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 28V8M11 16l9-9 9 9M7 31h26" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Sube la foto de tu plato</span>
      </div>
      <!-- 2 · carga y 3 · check -->
      <svg id="L_carga" class="c" width="70" height="70" viewBox="-35 -35 70 70"><circle r="27" fill="none" stroke="#ffffff33" stroke-width="7"/><path id="arco" d="" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>
      <svg id="L_check" class="c" width="70" height="70" viewBox="-35 -35 70 70"><path id="checkpath" d="M-19 1 L-6 14 L20 -13" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg>
      <!-- 4 · isla -->
      <div id="L_isla" class="c row" style="gap:22px;white-space:nowrap;color:#fff">
        <img src="assets/reel/real_E1.jpg" style="width:84px;height:84px;object-fit:cover;border-radius:22px;display:block">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:22px;color:#ffffff99;font-weight:500;letter-spacing:1px">SOCIETY</span>
          <span style="font-size:34px;font-weight:600;letter-spacing:-0.4px">Foto recibida</span>
        </div>
        <div id="islaPunto" class="punto" style="width:24px;height:24px;border-radius:12px;background:var(--cobalto);margin-left:14px"></div>
      </div>
      <!-- 5 · foto del cliente → foto profesional → letras → post -->
      <div id="L_foto" class="card c"><img src="assets/reel/real_E1.jpg"></div>
      <div id="L_raw" class="card c"><img src="assets/reel/raw_E1.jpg">
        <div id="letrasE1" style="position:absolute;inset:0"></div>
        <div id="pieE1" style="position:absolute;left:30px;top:880px;font-family:GeistMono;font-size:20px;color:#EDE7DD;white-space:pre"></div>
      </div>
      <div id="escaneo" style="position:absolute;left:0;height:6px;background:var(--cobalto)"></div>
      <div id="chipFoto" class="chip"><span class="punto" style="background:#fff"></span>Tu foto · móvil</div>
      <div id="chipPro" class="chip" style="background:var(--cobalto)"><span class="punto" style="background:#fff"></span>Con Society</div>
      <div id="pildora" class="row" style="position:absolute;height:84px;padding:0 38px;border-radius:42px;background:#fff;color:var(--tinta);font-size:32px;font-weight:650;gap:14px;white-space:nowrap">
        <span class="punto" style="width:16px;height:16px;border-radius:8px;background:var(--cobalto)"></span>Mejorar foto
      </div>
      <!-- 6 · carrusel -->
      <div id="L_tira" class="c"><div id="tira" class="row" style="position:absolute;left:0;top:0"></div></div>
      <!-- 7 · «PLAZA» sobre la foto original de Axpe -->
      <div id="L_e2" class="card c" style="background:#2b3035">
        <div id="e2" style="position:absolute;left:0;top:0;width:1856px;height:2304px;transform-origin:0 0">
          <img src="assets/reel/raw_E2.jpg" style="position:absolute;left:0;top:0;width:1856px;height:2304px">
          <div style="position:absolute;left:70px;top:40px;font-family:AN;font-weight:500;font-size:44px;color:#151515">Asador Etxebarri, Axpe</div>
          <div style="position:absolute;right:70px;top:40px;font-family:AN;font-weight:500;font-size:44px;color:#151515">02/06</div>
          <div id="e2tit" style="position:absolute;left:66px;top:105px;font-family:AN;font-weight:700;font-size:132px;line-height:.9;color:#141414;white-space:nowrap"></div>
          <div style="position:absolute;left:-200px;top:1340px;width:2256px;height:964px;perspective:1100px;perspective-origin:50% 0%">
            <div id="plaza" style="position:absolute;left:0;right:0;bottom:230px;height:780px;transform:rotateX(64deg);transform-origin:50% 100%;transform-style:preserve-3d"></div>
          </div>
          <div id="e2pie" style="position:absolute;left:70px;top:2150px;font-family:AN;font-weight:500;font-size:44px;line-height:1.25;color:#F4F1EA">Bittor Arguinzoniz enciende las brasas con leña<br>cada mañana desde 1990.</div>
        </div>
      </div>
      <!-- 8 · ráfaga de posts -->
      <div id="L_rafaga" class="card c"></div>
      <div id="contador" class="chip" style="left:auto;right:30px">01 / 17</div>
      <!-- 9 · semana -->
      <div id="L_semana" class="c" style="width:900px;height:1060px;margin:-530px 0 0 -450px">
        <div style="position:absolute;left:56px;top:52px;font-family:Anton;font-size:30px;letter-spacing:.06em;color:var(--cobalto)">SEMANA 43</div>
        <div style="position:absolute;left:56px;top:96px;font-family:Playfair;font-style:italic;font-weight:700;font-size:64px;letter-spacing:-0.5px">Tu semana</div>
        <div id="cols"></div>
        <div id="aprobar" class="row" style="position:absolute;left:56px;right:56px;top:900px;height:104px;border-radius:52px;background:var(--cobalto);color:#fff;justify-content:center;font-size:36px;font-weight:650;gap:16px">
          Aprobar la semana
        </div>
      </div>
      <!-- 10 · aviso -->
      <div id="L_aviso" class="c row" style="gap:22px;white-space:nowrap;color:#fff;font-size:36px;font-weight:600;letter-spacing:-0.4px">
        <svg width="66" height="66" viewBox="-33 -33 66 66"><circle r="33" fill="#2440E0"/><path id="avisoCheck" d="M-13 1 L-4 10 L14 -9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg>
        <span>Tu semana, lista para publicar.</span>
      </div>
      <!-- 11 · logo -->
      <div id="L_logo" class="c" style="width:760px;height:760px;margin:-380px 0 0 -380px">
        <img src="assets/reel/logo.png" style="width:760px;height:760px;display:block">
      </div>
    </div>
    <!-- fuera del recorte: puntos del carrusel -->
    <div id="outer"><div id="puntos" class="row" style="position:absolute;left:0;top:520px;gap:14px;transform:translateX(-50%)"></div></div>
  </div>
  <!-- pantalla: rótulos, mascota, notas -->
  <div id="caps"></div>
  <div id="notas"></div>
  <div id="mascotas"></div>
  <svg id="cursor" viewBox="0 0 46 46"><path d="M6 4 L6 36 L14.5 28 L20 40.5 L25.5 38 L20 26 L32 26 Z" fill="#141414" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
</div>

<script>
// ───────────── Rejilla ─────────────
const BPM = 120, B = 60 / BPM, BEATS = 40, DUR = BEATS * B;      // 20 s, 10 compases
const W = 1080, H = 1920, CX = 540, CY = 1010;
const COBALTO = [36, 64, 224], TINTA = [20, 20, 20], BLANCO = [255, 255, 255], LOGO = [26, 26, 26];
const CW = 760, CH = 950;

// ───────────── Muelles (respuesta al escalón, forma cerrada) ─────────────
function S(t, f = 3, z = 0.86) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// Suma de un muelle por cambio de objetivo; envuelve el bucle.
function pista(keys, f0 = 3, z0 = 0.86) {
  const ev = (t) => {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [ti, vi, fi, zi] = keys[i];
      v += (vi - keys[i - 1][1]) * S(t - ti, fi ?? f0, zi ?? z0);
    }
    return v;
  };
  const fin = keys[keys.length - 1][1];
  return (t) => ev(t) + (ev(t + DUR) - fin);
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const suave = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const rgb = (c) => `rgb(${c.map((v) => Math.round(clamp(v, 0, 255))).join(',')})`;
const $ = (id) => document.getElementById(id);
const env = (t) => ((t % DUR) + DUR) % DUR;

// Cambio de contenido con desenfoque corto
function capa(t, a, b, opts = {}) {
  const ent = opts.ent ?? 0.16, sal = opts.sal ?? 0.12;
  if (a <= b) return Math.min(suave((t - a) / ent), 1 - suave((t - (b - 0.04)) / sal));
  return t >= a ? suave((t - a) / ent) : 1 - suave((t - (b - 0.04)) / sal);   // cruza el bucle
}
function pinta(el, k, centro = true) {
  el.style.opacity = k.toFixed(3);
  el.style.visibility = k <= 0.001 ? 'hidden' : 'visible';
  const blur = (1 - k) * 14;
  el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  el.style.transform = (centro ? 'translate(-50%,-50%) ' : '') + `scale(${(0.94 + 0.06 * k).toFixed(4)})`;
}
const ver = (el, k) => { el.style.opacity = k.toFixed(3); el.style.visibility = k <= 0.001 ? 'hidden' : 'visible'; };

// ───────────── Estados de la forma ─────────────
const E = [
  [0.00, 560, 150, 75, TINTA],     // botón
  [0.52, 150, 150, 75, TINTA],     // carga
  [1.00, 150, 150, 75, COBALTO],   // check
  [1.50, 620, 134, 67, TINTA],     // isla
  [2.00, CW, CH, 44, BLANCO],      // foto del cliente
  [9.42, 700, 875, 44, BLANCO],    //   pulso
  [9.55, CW, CH, 44, BLANCO],      // Axpe
  [14.00, 900, 1060, 56, BLANCO],  // semana
  [16.50, 720, 134, 67, TINTA],    // aviso
  [17.50, 760, 760, 56, LOGO],     // logo
  [19.00, 560, 150, 75, TINTA],    // vuelta al botón
];
const pW = pista(E.map((e) => [e[0], e[1]]), 3.2);
const pH = pista(E.map((e) => [e[0], e[2]]), 3.2);
const pR = pista(E.map((e) => [e[0], e[3]]), 3.2);
const pC = [0, 1, 2].map((c) => pista(E.map((e) => [e[0], e[4][c]]), 4, 1));
const zoomDe = (w, h) => Math.min(2.2, 0.84 * W / w, 0.62 * H / h);
const pZ = pista(E.map((e) => [e[0], Math.log(zoomDe(e[1], e[2]))]), 1.7, 0.92);
// Giro 3D de la tarjeta: al escribir el post y al pintar «PLAZA»
const pRX = pista([[0, 0], [4.00, 16, 2.2], [6.80, 0, 2.4], [9.60, 9, 2.2], [11.30, 0, 2.6]]);
const pRY = pista([[0, 0], [4.00, -14, 2.2], [6.80, 0, 2.4], [9.60, 6, 2.2], [11.30, 0, 2.6]]);

// ───────────── Cursor ─────────────
const REPOSO = [320, 560];
const AGARRE = 0.18;
const arrastre = (r) => [[r - 0.38, 250, 120], [r - AGARRE + 0.01, -170, 140, 5.5]];
const SUELTAS = [7.75, 8.25, 8.75, 9.25];
const RUTA = [
  [0, ...REPOSO],
  [0.10, 150, 30],                    // al botón
  [0.70, 240, 170],
  [1.62, 220, 18],                    // a la isla
  [2.30, 40, 392],                    // a «Mejorar foto»
  [3.20, 330, 560],                   // se aparta
  ...SUELTAS.flatMap(arrastre),       // carrusel
  [9.45, 330, 580],
  [15.40, 60, 452],                   // a «Aprobar la semana»
  [16.40, 240, 200],
  [18.70, ...REPOSO],
];
const pX = pista(RUTA.map((r) => [r[0], r[1], r[3]]), 3.0, 1);
const pY = pista(RUTA.map((r) => [r[0], r[2], r[3]]), 3.0, 1);
const CLICS = [[0.44, 0.52], [1.92, 2.00], [2.94, 3.00], [15.94, 16.02]];
const ARRASTRES = SUELTAS.map((r) => [r - AGARRE, r]);
const pPulsa = (() => {
  const keys = [[0, 1]];
  for (const [a, b] of CLICS.concat(ARRASTRES).sort((p, q) => p[0] - q[0])) { keys.push([a, 0.82, 9, 0.9]); keys.push([b, 1, 7, 0.8]); }
  return pista(keys);
})();
// La forma se hunde un poco con cada clic y late con cada corte de la ráfaga
const RAFAGA = ['S1', 'D1', 'D3', 'S5', 'E5', 'D2', 'S3', 'E6', 'D4', 'S4'];
const T_RAF = 11.5, P_RAF = 0.25;
const pHunde = (() => {
  const keys = [[0, 1]];
  for (const [a, b] of CLICS) { keys.push([a, 0.965, 9, 0.9]); keys.push([b, 1, 6, 0.7]); }
  for (let i = 1; i < RAFAGA.length; i++) { const t = T_RAF + i * P_RAF; keys.push([t, 0.975, 12, 0.9]); keys.push([t + 0.04, 1, 7, 0.75]); }
  return pista(keys);
})();

// ───────────── Letras de «FUEGO» que caen sobre la foto profesional ─────────────
const FUEGO = 'FUEGO', T_FUEGO = 4.25, P_FUEGO = 0.375;
{
  // mismo encuadre que el post terminado: palabra a todo el ancho, arriba
  const anchos = [0.22, 0.215, 0.205, 0.215, 0.235], x0 = -0.03; let x = x0;
  FUEGO.split('').forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'letra'; el.id = 'fl' + i; el.textContent = c;
    el.style.left = (x * CW) + 'px'; el.style.top = '38px'; el.style.fontSize = '330px';
    $('letrasE1').appendChild(el); x += anchos[i];
  });
}
const PIE_E1 = 'Asador Etxebarri, Axpe\nTodo pasa por el fuego.';
// ───────────── «PLAZA» que cae sobre el suelo de Axpe ─────────────
const PLAZA = 'PLAZA', T_PLAZA = 10.0, P_PLAZA = 0.25;
{
  const cont = $('plaza');
  const fila = document.createElement('div');
  fila.style.cssText = 'position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;transform-style:preserve-3d;font-family:AN;font-weight:700;font-size:780px;line-height:.9;letter-spacing:.02em;color:#F6F3EC';
  PLAZA.split('').forEach((c, i) => { const s = document.createElement('span'); s.id = 'pl' + i; s.textContent = c; s.style.display = 'inline-block'; fila.appendChild(s); });
  cont.appendChild(fila);
}
const TIT_E2 = ['Un', 'pueblo,', 'una', 'plaza,', '<br>una', 'parrilla.'];
$('e2tit').innerHTML = TIT_E2.map((w, i) => `<span id="tw${i}">${w.replace('<br>', '')}</span>`).map((s, i) => (TIT_E2[i].startsWith('<br>') ? '<br>' : (i ? ' ' : '')) + s).join('');
$('e2').style.transform = `translate(${(CW - 1856 * CH / 2304) / 2}px,0) scale(${CH / 2304})`;

// ───────────── Carrusel ─────────────
const TIRA = { ids: ['E1', 'E3', 'E4', 'E5', 'E6'], a: 7.0, b: 9.5 };
$('tira').innerHTML = TIRA.ids.map((s) => `<img src="assets/posts/${s}.jpg" style="width:${CW}px;height:${CH}px;flex:none;display:block">`).join('');
$('puntos').innerHTML = TIRA.ids.map((_, i) => `<div id="pt${i}" style="width:14px;height:14px;border-radius:7px;background:#141414"></div>`).join('');
function posTira(t) {
  let x = 0;
  for (const r of SUELTAS) {
    const p = r - AGARRE;
    if (t >= p && t < r) x += (pX(t) - pX(p));
    if (t >= r) { const dx = pX(r) - pX(p); const k = S(t - r, 4.4, 0.9); x += -CW * k + dx * (1 - k); }
  }
  return x;
}
// ───────────── Ráfaga ─────────────
$('L_rafaga').innerHTML = RAFAGA.map((s, i) => `<img id="rf${i}" src="assets/posts/${s}.jpg">`).join('');
// ───────────── Semana ─────────────
const DIAS = [['Lun', 'E2'], ['Mié', 'D3'], ['Vie', 'S5']];
DIAS.forEach(([d, p], i) => {
  const x = 56 + i * 270;
  $('cols').insertAdjacentHTML('beforeend',
    `<div style="position:absolute;left:${x}px;top:210px;width:248px;font-size:30px;font-weight:600;color:#8A8780">${d}</div>
     <div style="position:absolute;left:${x}px;top:262px;width:248px;height:600px;border-radius:28px;background:#F1EEE6"></div>
     <img id="sem${i}" src="assets/posts/${p}.jpg" style="position:absolute;left:${x + 14}px;top:280px;width:220px;height:275px;border-radius:16px;object-fit:cover;box-shadow:0 14px 30px rgba(20,20,20,.18);transform-origin:50% 0">
     <div id="hora${i}" style="position:absolute;left:${x + 14}px;top:574px;font-size:26px;font-weight:600;color:#141414">${['13:00', '20:30', '12:00'][i]} · listo</div>`);
});

// ───────────── Rótulos, notas y mascota (pantalla) ─────────────
const CAPS = [
  [19.0, 1.5, '', 'De la foto del móvil<br>al post listo.'],
  [1.5, 3.0, '01', 'Subes la foto de tu plato.'],
  [3.0, 4.0, '02', 'La IA la deja profesional.', 'Mismo plato. Nada inventado.'],
  [4.0, 7.0, '03', 'Escribe y diseña el post.'],
  [7.0, 9.5, '04', 'Monta el carrusel entero.'],
  [9.5, 11.5, '', 'Sobre tu foto,<br>sin tocarla.'],
  [11.5, 14.0, '', 'Con cualquier cocina.'],
  [14.0, 17.5, '05', 'Y te planifica la semana.'],
  [17.5, 19.0, '', 'Tu agencia de marketing<br>con IA.'],
];
CAPS.forEach(([a, b, n, t, s], i) => $('caps').insertAdjacentHTML('beforeend',
  `<div id="cap${i}" class="cap">${n ? `<span class="n">${n}</span>` : ''}<div class="t">${t}</div>${s ? `<span class="s">${s}</span>` : ''}</div>`));
const NOTAS = [
  [1.5, 3.5, 'Foto original: Ryan Snyder (CC BY 2.0) · ejemplo, propuesta no oficial'],
  [3.5, 17.5, 'Ejemplos con restaurantes reales · propuestas no oficiales'],
];
NOTAS.forEach(([a, b, t], i) => $('notas').insertAdjacentHTML('beforeend', `<div id="nota${i}" class="nota">${t}</div>`));
// [archivo, entra, sale, x centro, alto, giro]
const MASC = [
  ['thumbs-up', 1.0, 1.9, 870, 400, 4],
  ['thinking', 2.06, 2.96, 900, 420, -3],
  ['pointing', 3.04, 3.96, 905, 430, 0],
  ['crouch', 7.06, 9.44, 900, 330, 2],
  ['sitting', 16.56, 17.46, 860, 360, 0],
  ['thumbs-up', 17.56, 18.9, 880, 420, -4],
];
MASC.forEach(([f], i) => $('mascotas').insertAdjacentHTML('beforeend', `<img id="ms${i}" class="masc" src="mascota/${f}.png">`));

// ───────────── seek(t) ─────────────
function seek(tAbs) {
  const t = env(tAbs);
  const w = pW(t), h = pH(t), r = pR(t), col = pC.map((p) => p(t)), hunde = pHunde(t);
  // la tarjeta acompaña un poco al cursor en los arrastres
  let dx = 0, rot = 0;
  for (const [a, b] of ARRASTRES) {
    if (t >= a && t < b) { const d = pX(t) - pX(a); dx += d * 0.06; rot += d * 0.004; }
    if (t >= b) { const d = pX(b) - pX(a); const k = 1 - S(t - b, 3, 0.7); dx += d * 0.06 * k; rot += d * 0.004 * k; }
  }
  const sh = $('shape');
  sh.style.width = w + 'px'; sh.style.height = h + 'px';
  sh.style.left = (CX - w / 2 + dx) + 'px'; sh.style.top = (CY - h / 2) + 'px';
  sh.style.borderRadius = r + 'px';
  sh.style.background = rgb(col);
  sh.style.transform = `perspective(2200px) rotateX(${pRX(t).toFixed(3)}deg) rotateY(${pRY(t).toFixed(3)}deg) scale(${hunde.toFixed(4)}) rotate(${rot.toFixed(3)}deg)`;
  const claro = col[0] > 200;
  sh.style.boxShadow = `0 ${Math.round(h * 0.03 + 18)}px ${Math.round(h * 0.06 + 40)}px rgba(20,20,20,${claro ? 0.12 : 0.18})`;
  $('outer').style.left = (CX + dx) + 'px'; $('outer').style.top = CY + 'px';

  // Cámara
  const z = Math.exp(pZ(t));
  $('world').style.transform = `translate(${CX - CX * z}px, ${CY - CY * z}px) scale(${z.toFixed(5)})`;

  // Botón, carga, check, isla
  pinta($('L_boton'), capa(t, 19.02, 0.52));
  pinta($('L_carga'), capa(t, 0.56, 1.0));
  $('arco').setAttribute('d', arco(t));
  pinta($('L_check'), capa(t, 1.0, 1.5));
  $('checkpath').style.strokeDashoffset = (1 - suave((t - 1.02) / 0.22)).toFixed(3);
  pinta($('L_isla'), capa(t, 1.56, 2.0));
  $('islaPunto').style.transform = `scale(${1 + 0.35 * Math.max(0, Math.sin((t - 1.56) * Math.PI * 4)) * (t > 1.56 && t < 2 ? 1 : 0)})`;

  // Foto del cliente: entra torcida como una foto de móvil y se endereza
  const kf = capa(t, 2.04, 3.56);
  pinta($('L_foto'), kf);
  const tor = (1 - S(t - 2.0, 2.4, 0.7)) * -4;
  $('L_foto').style.transform += ` rotate(${tor.toFixed(3)}deg)`;
  // Escaneo: la foto profesional se descubre de arriba abajo bajo una línea cobalto
  const ke = suave((t - 3.0) / 0.5);
  const kraw = t >= 3.0 && t < 7.2 ? 1 - suave((t - 7.06) / 0.12) : 0;
  const lr = $('L_raw');
  lr.style.visibility = kraw > 0.001 ? 'visible' : 'hidden'; lr.style.opacity = kraw;
  lr.style.transform = 'translate(-50%,-50%)';
  lr.style.clipPath = `inset(0 0 ${((1 - ke) * 100).toFixed(2)}% 0)`;
  const esc = $('escaneo');
  esc.style.width = w + 'px'; esc.style.top = (ke * h - 3) + 'px';
  esc.style.opacity = t > 2.98 && t < 3.56 ? Math.min(1, (t - 2.98) / 0.04, (3.56 - t) / 0.06) : 0;
  ver($('chipFoto'), capa(t, 2.10, 3.0));
  ver($('chipPro'), capa(t, 3.30, 4.1));
  const pil = $('pildora');
  const kp = capa(t, 2.30, 3.06);
  ver(pil, kp);
  pil.style.left = (w / 2) + 'px'; pil.style.top = (h / 2 + 392) + 'px';
  pil.style.transform = `translate(-50%,-50%) scale(${(0.9 + 0.1 * kp) * (t > 2.94 && t < 3.0 ? 0.94 : 1)})`;
  // Letras: cada una cae desde la cámara y se asienta con muelle
  FUEGO.split('').forEach((_, i) => {
    const t0 = T_FUEGO + i * P_FUEGO, el = $('fl' + i);
    const k = S(t - t0, 3.6, 0.62);
    const vis = t >= t0 - 0.02 ? clamp((t - t0 + 0.02) / 0.06) : 0;
    el.style.opacity = vis;
    el.style.transform = `translate(${((1 - k) * (i - 2) * 60).toFixed(1)}px, ${((1 - k) * -120).toFixed(1)}px) scale(${(1 + (1 - k) * 1.6).toFixed(4)}) rotate(${((1 - k) * (i % 2 ? 9 : -9)).toFixed(2)}deg)`;
    el.style.filter = k < 0.97 ? `blur(${((1 - k) * 10).toFixed(2)}px)` : 'none';
  });
  const nPie = clamp(Math.floor((t - 6.05) / 0.014), 0, PIE_E1.length);
  $('pieE1').textContent = t > 6.05 ? PIE_E1.slice(0, nPie) : '';

  // Carrusel con los posts terminados
  const kt = capa(t, 7.0, 9.42, { ent: 0.14 });
  pinta($('L_tira'), Math.max(kt, t >= 6.9 && t < 7.0 ? suave((t - 6.9) / 0.1) : 0));
  $('tira').style.transform = `translate(${-CW / 2 + posTira(t)}px, ${-CH / 2}px)`;
  const idx = clamp(-posTira(t) / CW, 0, TIRA.ids.length - 1);
  TIRA.ids.forEach((_, i) => {
    const k = clamp(1 - Math.abs(idx - i));
    const p = $('pt' + i); p.style.width = (14 + 26 * k) + 'px'; p.style.opacity = 0.25 + 0.75 * k;
  });
  ver($('puntos'), capa(t, 7.1, 9.42));

  // Axpe: el título palabra a palabra y «PLAZA» letra a letra sobre el suelo
  pinta($('L_e2'), capa(t, 9.56, 11.56));
  TIT_E2.forEach((_, i) => { const k = suave((t - (9.72 + i * 0.05)) / 0.12); const s = $('tw' + i); s.style.opacity = k; s.style.filter = k < 0.99 ? `blur(${(1 - k) * 8}px)` : 'none'; });
  PLAZA.split('').forEach((_, i) => {
    const t0 = T_PLAZA + i * P_PLAZA, s = $('pl' + i);
    const k = S(t - t0, 3.4, 0.55);
    s.style.opacity = t >= t0 - 0.02 ? clamp((t - t0 + 0.02) / 0.05) : 0;
    s.style.transform = `translateZ(${((1 - k) * 900).toFixed(1)}px) rotateX(${((1 - k) * -50).toFixed(2)}deg)`;
  });
  $('e2pie').style.opacity = suave((t - 11.15) / 0.15);

  // Ráfaga: un post por corchea
  const kr = capa(t, T_RAF, 14.0, { ent: 0.06 });
  pinta($('L_rafaga'), kr);
  const ir = clamp(Math.floor((t - T_RAF) / P_RAF), 0, RAFAGA.length - 1);
  RAFAGA.forEach((_, i) => { $('rf' + i).style.visibility = i === ir && kr > 0.001 ? 'visible' : 'hidden'; });
  const cnt = $('contador');
  ver(cnt, capa(t, T_RAF + 0.05, 13.96, { ent: 0.08 }));
  cnt.textContent = `${String(Math.min(17, 7 + ir + 1)).padStart(2, '0')} / 17`;

  // Semana: las tres miniaturas caen en su día
  const ks = capa(t, 14.04, 16.5);
  pinta($('L_semana'), ks);
  DIAS.forEach((_, i) => {
    const t0 = 14.5 + i * 0.25, k = S(t - t0, 3.4, 0.62), m = $('sem' + i);
    m.style.opacity = t >= t0 ? clamp((t - t0) / 0.06) : 0;
    m.style.transform = `translateY(${((1 - k) * -360).toFixed(1)}px) rotate(${((1 - k) * (i - 1) * 8).toFixed(2)}deg)`;
    $('hora' + i).style.opacity = suave((t - t0 - 0.3) / 0.15);
  });
  $('aprobar').style.transform = `scale(${t > 15.94 && t < 16.02 ? 0.95 : 1})`;
  $('aprobar').style.opacity = suave((t - 15.2) / 0.2);

  // Aviso y logo
  pinta($('L_aviso'), capa(t, 16.54, 17.5));
  $('avisoCheck').style.strokeDashoffset = (1 - suave((t - 16.75) / 0.22)).toFixed(3);
  pinta($('L_logo'), capa(t, 17.56, 19.0));

  // Rótulos y notas
  CAPS.forEach(([a, b], i) => pinta($('cap' + i), capa(t, a + 0.04, b), false));
  NOTAS.forEach(([a, b], i) => ver($('nota' + i), capa(t, a + 0.04, b)));
  // Mascota: sale desde abajo con muelle y se va hundiéndose
  MASC.forEach(([, a, b, x, alto, giro], i) => {
    const el = $('ms' + i);
    const ent = S(t - a, 3.2, 0.62), sal = S(t - b, 4, 1);
    const k = clamp(ent - sal, -0.2, 1.2);
    const vis = t > a - 0.01 && t < b + 0.3 ? 1 : 0;
    el.style.height = alto + 'px';
    el.style.left = (x - alto * 0.32) + 'px'; el.style.top = (H - 70 - alto) + 'px';
    el.style.visibility = vis ? 'visible' : 'hidden';
    el.style.transform = `translateY(${((1 - k) * (alto + 120)).toFixed(1)}px) rotate(${(giro * k).toFixed(2)}deg)`;
  });

  // Cursor en pantalla: tamaño fijo, posición transformada por la cámara
  const wx = CX + dx + pX(t), wy = CY + pY(t);
  const sx = CX + (wx - CX) * z, sy = CY + (wy - CY) * z;
  $('cursor').style.transform = `translate(${sx - 6}px, ${sy - 4}px) scale(${(1.6 * pPulsa(t)).toFixed(4)})`;
}

function arco(t) {
  const a0 = (t - 0.56) * 2 * Math.PI * 1.6 - Math.PI / 2;
  const len = 0.6 + 0.9 * suave((t - 0.56) / 0.4);
  const a1 = a0 + len * 1.2;
  const R = 27, p = (a) => `${(R * Math.cos(a)).toFixed(2)} ${(R * Math.sin(a)).toFixed(2)}`;
  return `M${p(a0)} A${R} ${R} 0 ${len * 1.2 > Math.PI ? 1 : 0} 1 ${p(a1)}`;
}

// API para el renderizador
async function seekListo(t) { seek(t); }
window.REEL = { DUR, BPM, seek, seekListo, preparaVideo: () => {},
  listo: () => document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })))) };
seek(0);
</script>
