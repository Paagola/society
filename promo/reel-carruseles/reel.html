<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Society · reel v3</title>
<!--
  Reel v3, 20 s (10 compases a 120 BPM) en 1080 × 1920. El flujo de Society contado con cambios de
  punto de vista en cada tramo: la carpeta de cristal donde el cliente suelta su foto, la foto vista
  desde la mesa, el escaneo, las letras vistas desde abajo, la rueda de posts, la plaza de Axpe vista
  desde arriba, una ráfaga con un ángulo por corte, la semana en carpetas y el logo.
  Los componentes de interfaz (cursor con etiqueta, carpeta de cristal y rueda de trabajos) están
  rehechos aquí a partir de los que pasó Víctor, para poder moverlos fotograma a fotograma.
  Todo sale de seek(t): sin transiciones CSS, sin temporizadores y sin estado entre fotogramas.
-->
<style>

  @font-face { font-family: GeistMono; src: url(fonts/GeistMono.woff2) format('woff2'); }
  @font-face { font-family: AN; src: url(fuentes/ArchivoNarrow.ttf); font-weight: 400 700; }
  @font-face { font-family: Anton; src: url(fonts/Anton.woff2) format('woff2'); }

  #mesa { position: absolute; inset: -200px; opacity: .12;
          background-image: radial-gradient(#141414 1.6px, transparent 2px); background-size: 32px 32px; }
  .esc { position: absolute; inset: 0; display: none; }
  .obj { position: absolute; left: 540px; top: 1040px; }
  img { display: block; }
  svg { overflow: visible; }

  /* ── tarjeta de foto ── */
  .tarjeta { width: 760px; height: 950px; border-radius: 40px; overflow: hidden; background: #fff;
             box-shadow: 0 40px 90px -30px rgba(20,20,20,.45), 0 0 0 1px rgba(20,20,20,.06); }
  .tarjeta > img, .capaimg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .chip { position: absolute; left: 28px; top: 28px; height: 58px; padding: 0 22px; border-radius: 29px; display: flex; align-items: center; gap: 14px;
          font-size: 25px; font-weight: 550; letter-spacing: -.01em; color: #fff; white-space: nowrap;
          background: rgba(20,20,22,.42); backdrop-filter: blur(14px) saturate(1.4);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px rgba(255,255,255,.12); }
  .chip .m { font-family: GeistMono; font-size: 18px; letter-spacing: .08em; color: rgba(255,255,255,.66); }
  .punto { width: 12px; height: 12px; border-radius: 6px; flex: none; }
  .letra { position: relative; font-family: Anton; color: #EDE7DD; line-height: 1; font-size: 360px; letter-spacing: -0.01em; transform-origin: 50% 60%; }

  /* ── carpeta de cristal (rehecha de glass-folder-cards) ── */
  .gf { position: absolute; font-family: Geist, system-ui, sans-serif; isolation: isolate; }
  .gf-stage { position: absolute; left: 0; top: 0; width: 340px; height: 272px; transform-origin: 0 0; }
  .gf-tilt { position: absolute; inset: 0; }
  .gf-shadow { position: absolute; left: 18px; right: 18px; bottom: -6px; height: 60px; border-radius: 40px; background: rgba(16,18,24,.34); filter: blur(22px); }
  .gf[data-tone=dark] .gf-shadow { background: rgba(0,0,0,.62); }
  .gf-back { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg,#f3f3f4 0%,#e3e3e6 100%); }
  .gf[data-tone=dark] .gf-back { background: linear-gradient(180deg,#2a2a2e 0%,#121214 100%); }
  .gf-art { position: absolute; left: -12px; top: -12px; width: 364px; height: 296px; max-width: none; object-fit: cover; }

  .gf-tint { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.5) 42%,rgba(252,252,252,.93) 100%); }
  .gf[data-tone=dark] .gf-tint { background: linear-gradient(180deg,rgba(18,18,20,.18) 0%,rgba(14,14,16,.62) 46%,rgba(8,8,10,.94) 100%); }

  /* ── ráfaga, aviso, logo ── */

<script>
// ───────────── Rejilla ─────────────
const BPM = 120, B = 60 / BPM, BEATS = 40, DUR = BEATS * B;      // 20 s, 10 compases
const W = 1080, H = 1920;

// ───────────── Muelles y curvas ─────────────
function S(t, f = 3, z = 0.86) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// Suma de un muelle por cambio de objetivo; f = 0 es un corte seco. Envuelve el bucle.
function pista(keys, f0 = 3, z0 = 0.86) {
  const ev = (t) => {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [ti, vi, fi, zi] = keys[i];
      const f = fi ?? f0;
      v += (vi - keys[i - 1][1]) * (f === 0 ? (t >= ti ? 1 : 0) : S(t - ti, f, zi ?? z0));
    }
    return v;
  };
  const fin = keys[keys.length - 1][1];
  return (t) => ev(t) + (ev(t + DUR) - fin);
}
// Pista de varias propiedades: cada clave lleva solo lo que cambia
function trk(keys, f0 = 2, z0 = 0.86) {
  const props = Object.keys(keys[0][1]), ps = {};
  for (const p of props) {
    let cur;
    ps[p] = pista(keys.map((k) => { if (k[1][p] !== undefined) cur = k[1][p]; return [k[0], cur, k[2], k[3]]; }), f0, z0);
  }
  return (t) => { const o = {}; for (const p of props) o[p] = ps[p](t); return o; };
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const suave = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const $ = (id) => document.getElementById(id);
const env = (t) => ((t % DUR) + DUR) % DUR;
const dentro = (t, a, b) => (a <= b ? t >= a && t < b : t >= a || t < b);
// cubic-bezier de CSS
function bez(x1, y1, x2, y2) {
  const c = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (c(x1, x2, m) < x) lo = m; else hi = m; }
    return c(y1, y2, (lo + hi) / 2);
  };
}
const EASE = bez(0.2, 0.8, 0.2, 1);
// Animación por claves [fracción, valor] con la curva en cada tramo
function claves(p, ks, curva = EASE) {
  if (p <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (p <= ks[i][0]) {
    const [a, va] = ks[i - 1], [b, vb] = ks[i];
    return lerp(va, vb, curva((p - a) / (b - a)));
  }
  return ks[ks.length - 1][1];
}
const ver = (el, k) => { el.style.opacity = k.toFixed(3); el.style.visibility = k <= 0.001 ? 'hidden' : 'visible'; };
const mostrar = (el, si) => { el.style.visibility = si ? 'visible' : 'hidden'; };
const escena = (el, si) => { el.style.display = si ? 'block' : 'none'; };

// Cámara: el objeto gira y se acerca alrededor de su centro (el punto de fuga)
const CAM0 = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0, s: 1 };
function cam(el, c, p = 1800, extra = '') {
  el.style.transform = `translate(-50%,-50%) perspective(${p}px) translate3d(${c.x.toFixed(2)}px,${c.y.toFixed(2)}px,${c.z.toFixed(2)}px) ` +
    `rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) rotateZ(${c.rz.toFixed(3)}deg) scale(${c.s.toFixed(4)}) ${extra}`;

  ...SUELTAS.flatMap((r) => [[r - 0.46, 800, 1080, 3.2], [r - AGARRE + 0.01, 400, 1080, 4.2]]),  // arrastres de la rueda hacia la izquierda
  [9.35, 860, 1500, 1.4],
];
const ruta = (R) => ({ x: pista(R.map((r) => [r[0], r[1], r[3], r[4] ?? 1]), 3, 1), y: pista(R.map((r) => [r[0], r[2], r[3], r[4] ?? 1]), 3, 1) });
const rTu = ruta(RUTA_TU), rSo = ruta(RUTA_SO);
const VIS_TU = [[19.3, 1.8], [15.2, 16.6]], VIS_SO = [[2.15, 3.9], [7.05, 9.48]];
const CLICS_TU = [[T_SUBE, T_SUBE + 0.08], [T_ABRE, T_ABRE + 0.08], [T_APRUEBA, T_APRUEBA + 0.08]];
const CLICS_SO = [[2.94, 3.0], ...SUELTAS.map((r) => [r - AGARRE, r])];
const pulsa = (C) => { const k = [[0, 1]]; for (const [a, b] of C) { k.push([a, 0.84, 9, 0.9]); k.push([b, 1, 7, 0.8]); } return pista(k); };
const pTu = pulsa(CLICS_TU), pSo = pulsa(CLICS_SO);
function pintaCursor(el, r, p, vis, t) {
  let k = 0;
  for (const [a, b] of vis) {
    const d = a <= b ? (t >= a - 0.01 && t < b + 0.2) : (t >= a - 0.01 || t < b + 0.2);
    if (d) { const ta = env(t - a), tb = env(t - b); k = Math.min(suave(ta / 0.18), ta < tb ? 1 : 1 - suave(tb / 0.15)); }
  }
  el.style.visibility = k > 0.001 ? 'visible' : 'hidden';
  el.style.opacity = k.toFixed(3);
  const x = r.x(t), y = r.y(t), sc = p(t) * (0.6 + 0.4 * k);
  el.style.transform = `translate(${(x - 3).toFixed(1)}px, ${(y - 5).toFixed(1)}px)`;
  el.firstChild.style.transform = `scale(${sc.toFixed(4)})`;
  // la etiqueta sigue al cursor con un poco de retraso (CursorFollow: abajo, al final)
  const lx = r.x(t - 0.06) - x, ly = r.y(t - 0.06) - y;
  el.lastChild.style.transform = `translate(${(34 + lx).toFixed(1)}px, ${(58 + ly).toFixed(1)}px) scale(${(0.7 + 0.3 * k).toFixed(3)})`;
}

// ───────────── Rótulos, notas y mascota ─────────────
// [entra, sale, etiqueta, frase, subtítulo, claro]
const CAPS = [
  [19.0, 0.9, 'Society', 'De la foto del móvil<br>al post listo.'],
  [0.9, 2.0, '01 — Tú', 'Subes la foto<br>de tu plato.'],
  [2.0, 4.0, '02 — Society', 'La deja profesional.', 'Mismo plato. Nada inventado.'],
  [4.0, 6.0, '03 — Diseño', 'Escribe y diseña<br>el post.'],
  [6.0, 6.5, '03 — Diseño', 'Escribe y diseña<br>el post.', '', 1],
  [6.5, 7.0, '03 — Diseño', 'Escribe y diseña<br>el post.'],
  [7.0, 9.5, '04 — Carrusel', 'Monta todos<br>tus posts.'],
  [9.5, 11.5, 'Sobre tu foto', 'Sin tocar<br>la foto original.'],
  [11.5, 14.0, 'Con cualquier cocina', 'Etxebarri, Disfrutar,<br>St. JOHN.'],
  [14.0, 16.5, '05 — Calendario', 'Y te planifica<br>la semana.'],
  [17.5, 19.0, 'Society', 'Tu agencia de<br>marketing con IA.'],
];
CAPS.forEach(([a, b, l, t, s, claro], i) => {
  let w = 0;
  const frase = t.split('<br>').map((lin) => lin.split(' ').map((p) => `<span data-w="${w++}">${p} </span>`).join('')).join('<br>');
  $('caps').insertAdjacentHTML('beforeend', `<div id="cap${i}" class="cap${claro ? ' claro' : ''}"><span class="l">${l}</span><div class="t">${frase}</div>${s ? `<span class="s">${s}</span>` : ''}</div>`);
});
const NOTAS = [
  [0.9, 3.5, 'Foto original: Ryan Snyder (CC BY 2.0) · ejemplo'],
  [3.5, 17.5, 'Restaurantes reales · propuestas no oficiales'],
];
NOTAS.forEach(([, , t], i) => $('notas').insertAdjacentHTML('beforeend', `<div id="nota${i}" class="nota">${t}</div>`));
// [archivo, entra, sale, x centro, alto, giro]
const MASC = [
  ['thumbs-up', 1.12, 1.95, 930, 300, 4],
  ['pointing', 3.04, 3.96, 950, 280, 0],
  ['thumbs-up', 17.56, 18.9, 930, 320, -4],
];
MASC.forEach(([f], i) => $('mascotas').insertAdjacentHTML('beforeend', `<img id="ms${i}" class="masc" src="mascota/${f}.png">`));

// ───────────── seek(t) ─────────────
function seek(tAbs) {
  const t = env(tAbs);

  // A · carpeta del cliente (19.0 → 2.0, cruza el bucle)
  const enA = dentro(t, 19.0, 2.0);
  escena($('escA'), enA);
  if (enA) {
    const c = camA(t);
    cam($('objA'), c);
    const px = clamp((rTu.x(t) - 540) / 420, -1, 1) * (t < 1.7 ? 1 : 0), py = clamp((rTu.y(t) - 1060) / 400, -1, 1) * (t < 1.7 ? 1 : 0);
    pintaCarpeta(cA, {
      st: estA(t),
      drop: t < 2.0 && t >= T_CAE ? t - T_CAE : null,
      meta: t >= T_CAE + 0.38 && t < 2.0 ? [1, t - T_CAE - 0.38] : [0, 9],
      ent: t >= 19.0 ? t - 19.0 : 9,
      px, py,
      pulsaTecla: t > T_SUBE && t < T_SUBE + 0.12 ? 0.93 : 1,
    });
  }

  // B/C · la foto (2.0 → 7.0)
  const enB = t >= 2.0 && t < 7.0;
  escena($('escB'), enB);
  if (enB) {
    const c = camB(t); c.ry += orbitaC(t);
    const tor = t < 3.0 ? (1 - S(t - 2.0, 1.6, 0.7)) * -4 : 0;    // la foto del móvil entra torcida
    c.rz += tor;
    cam($('objB'), c);
    // escaneo: la toma profesional aparece de arriba abajo bajo la línea cobalto
    const ke = suave((t - 3.0) / 0.5);
    $('crudo').style.clipPath = t < 3.0 ? 'inset(0 0 100% 0)' : `inset(0 0 ${((1 - ke) * 100).toFixed(2)}% 0)`;
    const esc = $('escaneo');
    esc.style.top = (ke * 950 - 3) + 'px';
    esc.style.opacity = t > 2.98 && t < 3.56 ? Math.min(1, (t - 2.98) / 0.04, (3.56 - t) / 0.06) : 0;
    ver($('chipFoto'), t < 3.0 ? suave((t - 2.15) / 0.2) * (1 - suave((t - 2.9) / 0.1)) : 0);
    ver($('chipPro'), t >= 3.3 && t < 4.0 ? suave((t - 3.3) / 0.2) : 0);
    const kp = t < 3.06 ? suave((t - 2.3) / 0.2) * (1 - suave((t - 3.0) / 0.06)) : 0;
    ver($('pildora'), kp);
    $('pildora').style.transform = `translateX(-50%) scale(${((0.9 + 0.1 * kp) * (t > 2.94 && t < 3.0 ? 0.94 : 1)).toFixed(4)})`;
    // letras: cada una cae desde la cámara y se asienta con muelle
    FUEGO.split('').forEach((_, i) => {
      const t0 = T_FUEGO + i * P_FUEGO, el = $('fl' + i);
      const k = S(t - t0, 3.6, 0.62);
      el.style.opacity = t >= t0 - 0.02 ? clamp((t - t0 + 0.02) / 0.06) : 0;
      el.style.transform = `translate(${((1 - k) * (i - 2) * 60).toFixed(1)}px, ${((1 - k) * -120).toFixed(1)}px) scale(${(1 + (1 - k) * 1.6).toFixed(4)}) rotate(${((1 - k) * (i % 2 ? 9 : -9)).toFixed(2)}deg)`;
      el.style.filter = k < 0.97 ? `blur(${((1 - k) * 10).toFixed(2)}px)` : 'none';
    });
    const nPie = clamp(Math.floor((t - 6.05) / 0.013), 0, PIE_E1.length);
    $('pieE1').textContent = t > 6.05 ? PIE_E1.slice(0, nPie) : '';
    ver($('postE1'), suave((t - 6.86) / 0.12));
  }

  // D · rueda (7.0 → 9.5)
  const enD = t >= 7.0 && t < 9.5;
  escena($('escD'), enD);
  if (enD) {
    const tr = giro(t), m = clamp(tr), pos = Math.max(0, tr - 1);
    const spin = (t - 7.0) * 14;                               // el anillo gira despacio
    const vista = suave((t - 7.6) / 0.6);
    $('ruedaEje').style.transform = `rotateX(${(7 * vista).toFixed(3)}deg) rotateZ(${(-2 * vista).toFixed(3)}deg) translateZ(${(-m * DRUM).toFixed(2)}px)`;
    for (let i = 0; i < N; i++) {
      const d = i - pos, el = $('rw' + i);
      const llega = S(t - 7.0 - i * 0.018, 2.6, 0.7);           // las tarjetas salen del centro al anillo
      el.style.transform = place(d * (360 / N) + spin * (1 - m), d * STEP, RING_R * llega, m);
      el.style.opacity = (m > 0.5 && Math.abs(d) > CULL ? 0 : clamp(llega * 3)).toFixed(3);
      el.firstChild.style.transform = `scale(${lerp(RING_SCALE * (0.4 + 0.6 * llega), 1, m).toFixed(4)})`;
    }
    const kt = suave((t - 7.1) / 0.25) * (1 - m);
    $('ruedaTit').style.opacity = kt.toFixed(3);
    $('ruedaTit').style.filter = kt < 0.99 ? `blur(${((1 - kt) * 8).toFixed(2)}px)` : 'none';
    // índice en cinta: el título del post de delante queda en el centro
    const act = clamp(Math.round(pos), 0, N - 1), f0 = Math.floor(pos), fr = pos - f0;
    const centro = (i) => { const li = $('ix' + clamp(i, 0, N - 1)); return li.offsetLeft + li.offsetWidth / 2; };
    $('indice').style.transform = `translateX(${(-lerp(centro(f0), centro(f0 + 1), fr)).toFixed(1)}px)`;
    $('indiceVent').style.opacity = (suave((t - 7.45) / 0.3)).toFixed(3);
    for (let i = 0; i < N; i++) $('ix' + i).style.color = i === act ? '#141414' : '';
  }

  // E · Axpe (9.5 → 11.5)
  const enE = t >= 9.5 && t < 11.5;
  escena($('escE'), enE);
  if (enE) {
    cam($('objE'), camE(t));
    TIT_E2.forEach((_, i) => { const k = suave((t - (9.62 + i * 0.05)) / 0.12); const s = $('tw' + i); s.style.opacity = k; s.style.filter = k < 0.99 ? `blur(${(1 - k) * 8}px)` : 'none'; });
    PLAZA.split('').forEach((_, i) => {
      const t0 = T_PLAZA + i * P_PLAZA, s = $('pl' + i);
      const k = S(t - t0, 3.4, 0.55);
      s.style.opacity = t >= t0 - 0.02 ? clamp((t - t0 + 0.02) / 0.05) : 0;
      s.style.transform = `translateZ(${((1 - k) * 900).toFixed(1)}px) rotateX(${((1 - k) * -50).toFixed(2)}deg)`;
    });
    $('e2pie').style.opacity = suave((t - 11.15) / 0.15);
  }

  // F · ráfaga (11.5 → 14.0)
  const enF = t >= T_RAF && t < 14.0;
  escena($('escF'), enF);
  if (enF) {
    const i = clamp(Math.floor((t - T_RAF) / P_RAF), 0, RAFAGA.length - 1), u = (t - T_RAF - i * P_RAF) / P_RAF;
    const [a, b] = ANGULOS[i], c = { ...CAM0 };
    for (const p in c) c[p] = lerp(a[p] ?? CAM0[p], b[p] ?? CAM0[p], EASE(u));
    cam($('objF'), c);
    RAFAGA.forEach((_, j) => mostrar($('rf' + j), j === i));
    $('contador').textContent = `${String(6 + i).padStart(2, '0')} / 17`;
  }

  // G · semana (14.0 → 17.5, con el aviso encima desde 16.5)
  const enG = t >= 14.0 && t < 17.5;
  escena($('escG'), enG);
  if (enG) {
    cam($('objG'), camG(t));
    cG.forEach((c, i) => {
      const t0 = T_CAEN[i];
      pintaCarpeta(c, { st: 0.3 * suave((t - t0 + 0.2) / 0.2) + 0.7 * S(t - t0 - 0.55, 1.6, 0.62), drop: t >= t0 ? t - t0 : null, meta: t >= t0 + 0.38 ? [1, t - t0 - 0.38] : [0, 9] });
    });
    const ka = suave((t - 15.3) / 0.25);
    $('aprobar').style.opacity = ka.toFixed(3);
    $('aprobar').style.transform = `translateY(${((1 - S(t - 15.3, 2.6, 0.7)) * 60).toFixed(1)}px) scale(${t > T_APRUEBA && t < T_APRUEBA + 0.08 ? 0.95 : 1})`;
    // con el aviso, la semana se queda detrás desenfocada
    const kb = suave((t - 16.5) / 0.3);
    $('escG').style.filter = kb > 0.001 ? `blur(${(kb * 14).toFixed(2)}px)` : 'none';
    $('escG').style.opacity = (1 - 0.35 * kb).toFixed(3);
  }
  // aviso: baja desde arriba como una notificación
  const ta = t - 16.5, kav = t >= 16.5 && t < 17.5 ? S(ta, 2.2, 0.7) : 0;
  ver($('aviso'), t >= 16.5 && t < 17.5 ? 1 : 0);
  $('aviso').style.transform = `translate(-50%, ${lerp(-220, 900, kav).toFixed(1)}px) perspective(1400px) rotateX(${((1 - kav) * 30).toFixed(2)}deg) rotateZ(${((1 - kav) * -6).toFixed(2)}deg) scale(${(1.18 + 0.04 * Math.max(0, Math.sin(Math.max(0, ta - 0.2) * 6)) * (ta < 0.7 ? 1 : 0)).toFixed(4)})`;
  $('avisoCheck').style.strokeDashoffset = (1 - suave((t - 16.75) / 0.22)).toFixed(3);

  // I · logo (17.5 → 19.0)
  const enI = t >= 17.5 && t < 19.0;
  escena($('escI'), enI);
  if (enI) cam($('objI'), camI(t));

  // mesa: un poco de paralaje con la cámara de cada tramo
  const par = enA ? camA(t) : enG ? camG(t) : CAM0;
  $('mesa').style.transform = `translate(${(-par.ry * 2 - par.x * 0.08).toFixed(1)}px, ${(par.rx * 2 - par.y * 0.08).toFixed(1)}px)`;

  // Rótulos: las palabras entran (gf-roll) y el rótulo sale desenfocado
  CAPS.forEach(([a, b], i) => {
    const el = $('cap' + i), on = dentro(t, a, b) || dentro(t, b, b + 0.12);
    mostrar(el, on);
    if (!on) return;
    const ta = env(t - a), tb = env(t - b), sale = dentro(t, b, b + 0.12) ? suave(tb / 0.12) : 0;
    const prev = CAPS[i - 1] ?? CAPS[CAPS.length - 1];
    const mismo = prev[3] === CAPS[i][3] && prev[1] === a;   // mismo texto que el anterior: sin entrada
    el.querySelectorAll('[data-w]').forEach((s) => {
      const k = mismo ? 1 : EASE((ta - 0.06 - s.dataset.w * 0.045) / 0.32);
      s.style.opacity = (k * (1 - sale)).toFixed(3);
      s.style.transform = `translateY(${((1 - k) * 18).toFixed(2)}px)`;
      const bl = (1 - k) * 8 + sale * 10;
      s.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none';
    });
    const ext = mismo ? 1 : suave((ta - 0.02) / 0.2);
    el.querySelector('.l').style.opacity = (ext * (1 - sale)).toFixed(3);
    const sub = el.querySelector('.s'); if (sub) sub.style.opacity = (suave((ta - 0.35) / 0.25) * (1 - sale)).toFixed(3);
  });
  NOTAS.forEach(([a, b], i) => ver($('nota' + i), dentro(t, a, b) ? 1 : 0));
  MASC.forEach(([, a, b, x, alto, giroM], i) => {
    const el = $('ms' + i);
    const k = clamp(S(t - a, 3.2, 0.62) - S(t - b, 4, 1), -0.2, 1.2);
    el.style.height = alto + 'px';
    el.style.left = (x - alto * 0.32) + 'px'; el.style.top = (H - 70 - alto) + 'px';
    mostrar(el, t > a - 0.01 && t < b + 0.3);
    el.style.transform = `translateY(${((1 - k) * (alto + 120)).toFixed(1)}px) rotate(${(giroM * k).toFixed(2)}deg)`;
  });

  // Cursores
  pintaCursor($('curTu'), rTu, pTu, VIS_TU, t);
  pintaCursor($('curSo'), rSo, pSo, VIS_SO, t);
}

// API para el renderizador
async function seekListo(t) { seek(t); }
const rect = (sel) => { const r = document.querySelector(sel).getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r.width, r.height].map(Math.round); };
window.REEL = { DUR, BPM, seek, seekListo, rect, preparaVideo: () => {},
  listo: () => document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })))) };
seek(0);
</script>
