aprendizajes_propuestos:
  - "En un anuncio propio de Society el gancho también sale del material real del caso: abrir con una imagen generada quieta puntúa 1 en la rúbrica (lo vimos en la primera versión de B)."
  - "No alternar corte a corte piezas de 9:16 y de 4:5: el salto a franjas negras se lee barato. Cada formato en su marco y en su tramo; el 4:5, sobre papel como pieza impresa (Víctor, 25/09/2026)."
  - "Un lenguaje material para toda la pieza (aquí, papel recortado y rasgado) conecta los planos mejor que los pases de efecto: cada transición es lo que haría ese papel (arrugarse, tirarse, abrirse, pegarse) (Víctor, 26/09/2026)."
  - "Si algo se arruga, se cierra hacia delante y enseña el dorso, como una envoltura real; y un recorte sin margen blanco, con fibra clara en el borde, se lee como recortado (Víctor, 26/09/2026)."
